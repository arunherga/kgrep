name: PR Integration Test

# Two tiers of testing on every PR:
#
# 1. build-and-test: builds kgrep and runs the full unit test suite (with
#    -race) natively on Linux, Windows, and macOS. This is the only way to
#    actually exercise the code on all three platforms in CI — the release
#    workflow cross-compiles all 5 binaries from a single Linux runner, which
#    never runs the Windows/macOS output at all, so this is what actually
#    catches platform-specific bugs (path handling, line endings, file
#    permissions, etc.) that cross-compilation can't.
#
# 2. integration-test: stands up a real, open-source Kafka cluster (KRaft
#    mode, no Zookeeper) plus a real Schema Registry, seeds throwaway topics
#    with known messages/schemas and real consumer-group activity, builds
#    kgrep from the PR's own code, and runs real assertions against real
#    output — covering every command, consumer-group/lag reporting,
#    multi-partition coverage, the --max-messages exactness guarantee,
#    time-window filtering, bad-record detection, and Avro/JSON Schema/
#    Protobuf decoding. This one is Linux-only, not by choice but by
#    platform constraint: GitHub-hosted macOS runners have no Docker daemon
#    at all, and Windows runners only support Windows containers, not the
#    Linux containers these images require — there is no way to run this
#    tier on those platforms in GitHub-hosted CI.
on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Kafka (KRaft, single node)
        run: |
          CLUSTER_ID=$(docker run --rm apache/kafka:latest /opt/kafka/bin/kafka-storage.sh random-uuid)
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e CLUSTER_ID="$CLUSTER_ID" \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            apache/kafka:latest

      - name: Wait for Kafka to accept connections
        run: |
          for i in $(seq 1 30); do
            if docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "Kafka is up"
              exit 0
            fi
            echo "Waiting for Kafka... ($i/30)"
            sleep 2
          done
          echo "Kafka never became ready" >&2
          docker logs kafka
          exit 1

      - name: Create test topics
        run: |
          # 3 partitions: exercises concurrent multi-partition scanning.
          docker exec kafka /opt/kafka/bin/kafka-topics.sh --create \
            --topic kgrep-ci-smoke-test --partitions 3 --replication-factor 1 \
            --bootstrap-server localhost:9092
          # 1 partition, dedicated to consumer-group/lag tests: with a single
          # partition, "consumed N of M" unambiguously means lag = M - N.
          # Across 3 partitions that arithmetic isn't guaranteed — a group
          # can be assigned all partitions but happen to read its first N
          # messages from just one of them, so lag would reflect only that
          # partition's backlog, not the naive total-minus-consumed value.
          docker exec kafka /opt/kafka/bin/kafka-topics.sh --create \
            --topic kgrep-ci-group-test --partitions 1 --replication-factor 1 \
            --bootstrap-server localhost:9092

      - name: Seed 9 keyed messages into the smoke-test topic
        run: |
          echo "BEFORE_PRODUCE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # Every message gets a distinct key so the default hash partitioner
          # spreads them across all 3 partitions instead of clustering them
          # on one (which is what happens with null keys under Kafka's
          # sticky-partitioner default).
          printf 'key1:hello-1\nkey2:hello-2\nkey3:hello-3\nkey4:hello-4\nkey5:hello-5\nkey6:hello-6\nkey7:hello-7\nkey8:hello-8\nkey9:hello-9\n' | \
            docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh \
              --topic kgrep-ci-smoke-test --bootstrap-server localhost:9092 \
              --property parse.key=true --property key.separator=:
          sleep 2
          echo "AFTER_PRODUCE_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Seed 10 messages into the group-test topic
        run: |
          seq 1 10 | sed 's/^/msg-/' | \
            docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh \
              --topic kgrep-ci-group-test --bootstrap-server localhost:9092
          sleep 2

      - name: Start Schema Registry
        run: |
          # --network host: the simplest way for this container to reach
          # the Kafka container above, which only advertises a
          # localhost-only PLAINTEXT listener (no separate inter-container
          # hostname/listener was set up for it). With host networking,
          # this container shares the runner's actual network stack, so
          # "localhost:9092" here reaches the same port Kafka published
          # via -p 9092:9092 — no changes to the Kafka step needed.
          docker run -d --name schema-registry --network host \
            -e SCHEMA_REGISTRY_HOST_NAME=localhost \
            -e SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=localhost:9092 \
            -e SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081 \
            confluentinc/cp-schema-registry:latest

      - name: Wait for Schema Registry to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/subjects >/dev/null 2>&1; then
              echo "Schema Registry is up"
              exit 0
            fi
            echo "Waiting for Schema Registry... ($i/30)"
            sleep 3
          done
          echo "Schema Registry never became ready" >&2
          docker logs schema-registry
          exit 1

      - name: Create and seed Avro / JSON Schema / Protobuf test topics
        run: |
          for topic in kgrep-ci-avro-test kgrep-ci-jsonschema-test kgrep-ci-protobuf-test kgrep-ci-protobuf-nested-test; do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh --create \
              --topic "$topic" --partitions 1 --replication-factor 1 --bootstrap-server localhost:9092
          done

          echo '{"orderId":"order-1","amount":42.5}' | docker exec -i schema-registry kafka-avro-console-producer \
            --topic kgrep-ci-avro-test --bootstrap-server localhost:9092 \
            --property schema.registry.url=http://localhost:8081 \
            --property value.schema='{"type":"record","name":"Order","fields":[{"name":"orderId","type":"string"},{"name":"amount","type":"double"}]}'

          echo '{"orderId":"order-2","amount":99.9}' | docker exec -i schema-registry kafka-json-schema-console-producer \
            --topic kgrep-ci-jsonschema-test --bootstrap-server localhost:9092 \
            --property schema.registry.url=http://localhost:8081 \
            --property value.schema='{"type":"object","properties":{"orderId":{"type":"string"},"amount":{"type":"number"}},"required":["orderId","amount"]}'

          echo '{"orderId":"order-3","amount":15.75}' | docker exec -i schema-registry kafka-protobuf-console-producer \
            --topic kgrep-ci-protobuf-test --bootstrap-server localhost:9092 \
            --property schema.registry.url=http://localhost:8081 \
            --property value.schema='syntax = "proto3"; message Order { string orderId = 1; double amount = 2; }'

          # A nested field type, not just top-level scalars -- exercises
          # protojson's structural nesting on top of the message-index path
          # already covered directly by unit tests.
          echo '{"item":{"sku":"sku-42","qty":3},"orderId":"order-9"}' | docker exec -i schema-registry kafka-protobuf-console-producer \
            --topic kgrep-ci-protobuf-nested-test --bootstrap-server localhost:9092 \
            --property schema.registry.url=http://localhost:8081 \
            --property value.schema='syntax = "proto3"; message Order { message Item { string sku = 1; int32 qty = 2; } Item item = 1; string orderId = 2; }'

      - name: Build kgrep from this PR's code
        run: go build -o ./kgrep-ci ./cmd/kgrep

      - name: Configure kgrep for the local test cluster
        run: |
          cat > .env <<EOF
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          KAFKA_SECURITY_PROTOCOL=PLAINTEXT
          KAFKA_DEFAULT_TOPIC=kgrep-ci-smoke-test
          SCHEMA_REGISTRY_URL=http://localhost:8081
          EOF

      - name: Assert — topics lists both seeded topics
        run: |
          ./kgrep-ci topics | tee topics.out
          grep -q "kgrep-ci-smoke-test" topics.out
          grep -q "kgrep-ci-group-test" topics.out

      - name: Assert — describe-topic reports the right count with no groups yet
        run: |
          ./kgrep-ci describe-topic --topic kgrep-ci-group-test | tee describe-before.out
          grep -q "Retained messages: 10" describe-before.out
          grep -q "(none)" describe-before.out

      - name: Create an inactive consumer group (consumes 4 of 10, then exits)
        run: |
          docker exec kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --topic kgrep-ci-group-test --bootstrap-server localhost:9092 \
            --group kgrep-ci-inactive-group --from-beginning --max-messages 4 \
            --timeout-ms 30000 \
            --consumer-property enable.auto.commit=true
          # A clean KafkaConsumer.close() (which --max-messages triggers on
          # reaching its count) sends an explicit LeaveGroup — this settles
          # server-side before the assertion reads group state.
          sleep 3

      - name: Create an active consumer group (stays running, catches up to all 10)
        run: |
          # docker exec -d is fire-and-forget: it returns as soon as the
          # command is *launched* inside the container, not once the JVM has
          # actually started and joined the group. A fixed sleep here raced
          # with that startup time and lost — the group wasn't AT ITS actual
          # first run, so poll for real evidence it joined instead of
          # guessing how long that takes.
          docker exec -d kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --topic kgrep-ci-group-test --bootstrap-server localhost:9092 \
            --group kgrep-ci-active-group --from-beginning \
            --consumer-property enable.auto.commit=true \
            --consumer-property auto.commit.interval.ms=1000

          joined=false
          for i in $(seq 1 30); do
            if docker exec kafka /opt/kafka/bin/kafka-consumer-groups.sh \
                 --bootstrap-server localhost:9092 --describe --group kgrep-ci-active-group 2>/dev/null \
                 | grep -q kgrep-ci-active-group; then
              joined=true
              echo "active group joined"
              break
            fi
            echo "waiting for active group to join... ($i/30)"
            sleep 2
          done
          if [ "$joined" != "true" ]; then
            echo "active group never joined" >&2
            exit 1
          fi

          # Membership alone isn't enough: groupsForTopic (internal/kafkaclient/admin.go)
          # only reports a group as associated with a topic once it has at
          # least one COMMITTED offset there — a group with no commits has
          # no lag to compute, so it's intentionally excluded. Give the 1s
          # auto-commit interval above several cycles to actually fire
          # before checking, since joining and committing aren't the same
          # moment.
          sleep 8

      - name: Assert — describe-topic reports both groups correctly
        run: |
          echo "=== Kafka's own view of the active group ==="
          docker exec kafka /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --describe --group kgrep-ci-active-group || true
          echo "=== Kafka's own view of the inactive group ==="
          docker exec kafka /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --describe --group kgrep-ci-inactive-group || true
          echo "=== kgrep's describe-topic (verbose) ==="
          ./kgrep-ci describe-topic --topic kgrep-ci-group-test --verbose 2>&1 | tee describe-after.out
          grep -qE "kgrep-ci-inactive-group \[[A-Za-z]+, inactive\] lag=6" describe-after.out
          grep -qE "kgrep-ci-active-group \[[A-Za-z]+, active\]" describe-after.out

      - name: Assert — dump reads exactly the seeded messages, no drops, full coverage
        run: |
          ./kgrep-ci dump --topic kgrep-ci-smoke-test --read-all --output-csv out.csv | tee dump.out
          grep -q "Scanned: 9" dump.out
          grep -q "Bad records: 0" dump.out
          grep -q "Partition coverage: 3/3 fully read" dump.out
          [ "$(tail -n +2 out.csv | wc -l)" -eq 9 ]
          for i in 1 2 3 4 5 6 7 8 9; do grep -q "hello-$i" out.csv; done

      - name: Assert — --max-messages is an exact cap across concurrent partitions
        run: |
          # Regression guard: concurrent partitions used to be able to each
          # emit one message already in flight before noticing a shared cap
          # was hit elsewhere, so --max-messages 1 could scan up to
          # (partition count) messages instead of exactly 1.
          ./kgrep-ci dump --topic kgrep-ci-smoke-test --max-messages 1 | tee capped.out
          grep -q "Scanned: 1" capped.out

      - name: Assert — consume finds a specific searched value
        run: |
          echo "hello-5" > search.csv
          ./kgrep-ci consume --topic kgrep-ci-smoke-test --allowed-keys-csv search.csv --match-mode value-field | tee search.out
          grep -q "Emitted: 1" search.out
          grep -q "hello-5" search.out

      - name: Assert — time-window filtering includes an in-range scan and excludes an out-of-range one
        run: |
          ./kgrep-ci dump --topic kgrep-ci-smoke-test --read-all \
            --from-time "$BEFORE_PRODUCE_TS" --to-time "$AFTER_PRODUCE_TS" | tee window-in.out
          grep -q "Scanned: 9" window-in.out

          ./kgrep-ci dump --topic kgrep-ci-smoke-test --read-all \
            --from-time "2000-01-01T00:00:00Z" --to-time "2000-01-01T00:00:01Z" | tee window-out.out
          grep -q "Scanned: 0" window-out.out

      - name: Assert — bad records are detected and counted, not silently dropped
        run: |
          # Forcing avro decoding on plain-string keys makes every one of
          # them fail — a deterministic way to exercise the bad-record path
          # against a real broker instead of only hand-built test fixtures.
          ./kgrep-ci consume --topic kgrep-ci-smoke-test --key-format avro --max-messages 9 | tee bad.out
          grep -q "Bad records: 9" bad.out
          grep -q "Good records: 0" bad.out

      - name: Assert — update refuses to run on a dev build
        run: |
          (./kgrep-ci update || true) 2>&1 | tee update.out
          grep -q "not available for development builds" update.out

      - name: Assert — Avro decodes correctly against a real Schema Registry
        run: |
          ./kgrep-ci dump --topic kgrep-ci-avro-test --read-all | tee avro.out
          grep -q "Bad records: 0" avro.out
          grep -q "order-1" avro.out
          grep -q "42.5" avro.out

      - name: Assert — JSON Schema decodes correctly (not misread as Avro)
        run: |
          ./kgrep-ci dump --topic kgrep-ci-jsonschema-test --read-all | tee jsonschema.out
          grep -q "Bad records: 0" jsonschema.out
          grep -q "order-2" jsonschema.out
          grep -q "99.9" jsonschema.out

      - name: Assert — Protobuf decodes correctly, including a nested field
        run: |
          ./kgrep-ci dump --topic kgrep-ci-protobuf-test --read-all | tee protobuf.out
          grep -q "Bad records: 0" protobuf.out
          grep -q "order-3" protobuf.out
          grep -q "15.75" protobuf.out

          ./kgrep-ci dump --topic kgrep-ci-protobuf-nested-test --read-all | tee protobuf-nested.out
          grep -q "Bad records: 0" protobuf-nested.out
          grep -q "sku-42" protobuf-nested.out
          grep -q "order-9" protobuf-nested.out

      - name: Show Kafka / Schema Registry logs on failure
        if: failure()
        run: |
          docker logs kafka
          docker logs schema-registry || true
