name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Tag ${{ github.ref_name }} is not reachable from main; aborting release." >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          out="dist/kgrep-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "$out" ./cmd/kgrep
      - uses: actions/upload-artifact@v4
        with:
          name: kgrep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: (cd dist && sha256sum kgrep-* > checksums.txt)
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > release-notes.md <<EOF
          # kgrep ${TAG}

          ## Linux
          - [kgrep-linux-amd64](${base}/kgrep-linux-amd64)
          - [kgrep-linux-arm64](${base}/kgrep-linux-arm64)

          ## macOS
          - [kgrep-darwin-amd64](${base}/kgrep-darwin-amd64) (Intel)
          - [kgrep-darwin-arm64](${base}/kgrep-darwin-arm64) (Apple Silicon)

          ## Windows
          - [kgrep-windows-amd64.exe](${base}/kgrep-windows-amd64.exe)

          ## Checksums
          Verify your download against [checksums.txt](${base}/checksums.txt):
          \`\`\`sh
          sha256sum -c checksums.txt --ignore-missing
          \`\`\`

          ## Installation

          ### Linux / macOS
          \`\`\`sh
          curl -fLO ${base}/kgrep-linux-amd64
          chmod +x kgrep-linux-amd64
          sudo mv kgrep-linux-amd64 /usr/local/bin/kgrep
          \`\`\`

          ### Windows (PowerShell)
          \`\`\`powershell
          Invoke-WebRequest -Uri ${base}/kgrep-windows-amd64.exe -OutFile kgrep.exe
          \`\`\`

          ## Usage
          \`\`\`sh
          kgrep --help
          \`\`\`

          Full install/verify instructions for every OS are in the [README](https://github.com/${{ github.repository }}#installing-in-detail).
          EOF
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
